<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Kana Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <fieldset id="selector">
        <legend class="visually-hidden">Script</legend>
        <label><input type="radio" name="script" value="hiragana" checked> Hiragana</label>
        <label><input type="radio" name="script" value="katakana"> Katakana</label>
        <label><input type="radio" name="script" value="both"> Both</label>
    </fieldset>
    <p id="status"></p>
    <p id="kana" lang="ja"></p>
    <label for="romaji" class="visually-hidden">Romaji</label>
    <input type="text" id="romaji" autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
    <p id="answer"></p>
    <p>Correct: <span id="correct">0</span> Wrong: <span id="wrong">0</span> Left: <span id="left">0</span></p>
    <section id="review" hidden>
        <h2>Kana to review</h2>
        <div id="review-groups"></div>
    </section>
</main>
<script src="scripts.js"></script>
</body>
</html>
