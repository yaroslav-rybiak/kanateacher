<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Kana Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <div id="selector">
        <div class="segmented" role="radiogroup" aria-label="Practise">
            <label><input type="radio" name="mode" value="kana" checked><span>Kana</span></label>
            <label><input type="radio" name="mode" value="words"><span>Words</span></label>
        </div>
        <div class="segmented" role="radiogroup" aria-label="Script">
            <label><input type="radio" name="script" value="hiragana" checked><span>Hiragana</span></label>
            <label><input type="radio" name="script" value="katakana"><span>Katakana</span></label>
            <label><input type="radio" name="script" value="both"><span>Both</span></label>
        </div>
    </div>
    <p id="status"></p>
    <p id="kana" lang="ja"></p>
    <label for="romaji" class="visually-hidden">Romaji</label>
    <input type="text" id="romaji" autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
    <p id="answer"></p>
    <p>Correct: <span id="correct">0</span> Wrong: <span id="wrong">0</span> Left: <span id="left">0</span></p>
    <section id="review" hidden>
        <h2 id="review-title">Kana to review</h2>
        <div id="review-groups"></div>
    </section>
</main>
<script src="romaji.js"></script>
<script src="words.js"></script>
<script src="scripts.js"></script>
</body>
</html>
