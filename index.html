<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Kana Practice</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-md-center">
        <div class="col">
            <div id="selector">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="script" id="script-hiragana" value="hiragana" checked>
                    <label class="form-check-label" for="script-hiragana">Hiragana</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="script" id="script-katakana" value="katakana">
                    <label class="form-check-label" for="script-katakana">Katakana</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="script" id="script-both" value="both">
                    <label class="form-check-label" for="script-both">Both</label>
                </div>
            </div>
            <p id="kana" lang="ja"></p>
            <label for="romaji" class="sr-only">Romaji</label>
            <input type="text" class="form-control col-md-4 col-sm-12 offset-md-4" id="romaji"
                   autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
    </div>
    <div class="row justify-content-md-center">
        <p id="answer"></p>
    </div>
    <div class="row justify-content-md-center">
        <p>Correct: <span id="correct">0</span> Wrong: <span id="wrong">0</span> Left: <span id="left">0</span></p>
    </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
